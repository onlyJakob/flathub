id: gg.norisk.noriskclient

runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22

command: noriskclient-launcher-v3
finish-args:
  - --socket=wayland # Permission needed to show the window
  - --socket=fallback-x11 # Permission needed to show the window
  - --device=dri # OpenGL, not necessary for all projects
  - --share=ipc
  - --share=network

modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json
  - name: noriskclient
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/NoRiskClient/noriskclient-launcher
        tag: v3
      - cargo-sources.json
      - generated-sources.json
      - type: file
        path: gg.norisk.noriskclient.metainfo.xml
      - type: file
        path: gg.norisk.noriskclient.desktop
    build-options:
      append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/noriskclient/cargo
    build-commands:
      - HOME=$PWD yarn config --offline set yarn-offline-mirror $FLATPAK_BUILDER_BUILDDIR/flatpak-node/yarn-mirror
      - yarn --offline
      - cargo --offline fetch --manifest-path src-tauri/Cargo.toml --verbose
      - yarn tauri build -- --no-bundle -- --offline
      - install -Dm755 src-tauri/target/release/noriskclient-launcher-v3 /app/bin/noriskclient-launcher-v3
      - install -Dm644 gg.norisk.noriskclient.desktop /app/share/applications/gg.norisk.noriskclient.desktop
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/gg.norisk.noriskclient.png
      - install -Dm644 gg.norisk.noriskclient.metainfo.xml /app/share/metainfo/gg.norisk.noriskclient.metainfo.xml
