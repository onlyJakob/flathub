on:
  push:
    branches: gg.norisk.noriskclient
name: Flatpak-CI
jobs:
  flatpak:
    name: "Flatpak"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: gg.norisk.noriskclient-${{ matrix.variant.arch }}.flatpak
          manifest-path: gg.norisk.NoRiskClientLauncherV3.yml
          cache-key: flatpak-builder-${{ github.sha }}
          arch: ${{ matrix.variant.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: noriskclient-flatpak-${{ matrix.variant.arch }}
          path: "*.flatpak"

  pre-release:
    name: "Pre Release"
    needs: flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: noriskclient-flatpak-*
          path: noriskclient-flatpak
          merge-multiple: true
      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: true
          title: "Development Build"
          files: |
            noriskclient-flatpak/*.flatpak


